<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductores|Vehículos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<button class="botonesPrincipales" id="botonVolver" onclick="volverInicio()" style="display: none;">
    VOLVER
</button>

<h1 id="titulo" style="display: block;">Conductores y Vehículos</h1>

<div>
    <button class="botonesPrincipales" onclick="crearConductor()">Crear Conductor</button>
    <div id="conductor" style="display: none;">
        <h1>CONDUCTOR</h1>

        <input id="nombre" placeholder="Nombre">
        <input id="edad" placeholder="Edad" type="number">

        <select id="carnet">
            <option>A1</option>
            <option>A2</option>
            <option>A3</option>
        </select>

        <select id="seguro">
            <option>Si</option>
            <option>No</option>
        </select>

        <button onclick="agregarConductor()">Guardar</button>
        <button onclick="borrarTodosConductores()">Borrar Todo</button>

        <h2>Conductores Creados:</h2>

        <table>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Carnet</th>
                <th>Seguro</th>
            </tr>

            <tbody id="lista"></tbody>
        </table>
    </div>
</div>



<div>
    <button class="botonesPrincipales" onclick="crearVehiculo()">Crear Vehículo</button>
    <div id="vehiculo" style="display: none;">
        <h1>VEHÍCULO</h1>

        <input id="marca" placeholder="Marca">
        <input id="modelo" placeholder="Modelo">
        <input id="patente" placeholder="Patente">

        <select id="tipo">
            <option>A1</option>
            <option>A2</option>
            <option>A3</option>
        </select>
        
        <select id="seguroVehiculo">
            <option>Si</option>
            <option>No</option>
        </select>

        <button onclick="agregarVehiculo()">Guardar</button>
        <button onclick="borrarTodosVehiculos()">Borrar Todo</button>

        <h2>Vehículos Creados:</h2>

        <table>
            <tr>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Patente</th>
                <th>Carnet</th>
            </tr>

            <tbody id="vehiculos"></tbody>
        </table>
    </div>
</div>



<div>
    <button class="botonesPrincipales" onclick="mostrarDatos()">Mostrar Datos</button>

    <div id="datos" style="display: none;">
        <h1>DATOS</h1>

        <div id="filtros">
            <button onclick="filtrarDatos('TODO')">TODO</button>
            <button onclick="filtrarDatos('A1')">A1</button>
            <button onclick="filtrarDatos('A2')">A2</button>
            <button onclick="filtrarDatos('A3')">A3</button>
            <button onclick="filtrarDatos('Seguro')">Seguro</button>
        </div>

        <h2>Conductores</h2>

        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Edad</th>
                    <th>Carnet</th>
                    <th>Seguro</th>
                </tr>
            </thead>
            <tbody id="datosConductores"></tbody>
        </table>

        <h2>Vehículos</h2>

        <table>
            <thead>
                <tr>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Patente</th>
                    <th>Carnet</th>
                    <th>Seguro</th>
                </tr>
            </thead>
            <tbody id="datosVehiculos"></tbody>
        </table>
    </div>
</div>


<script src="script.js"></script>

</body>
</html>
